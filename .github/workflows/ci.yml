name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.dc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dc: [ dmd-latest, ldc-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.dc }}

      - name: Build library
        run: dub build

      - name: Run test suite
        run: dub test

      - name: Build examples
        run: |
          (cd examples/hello && dub build)
          (cd examples/todos && dub build)
          (cd examples/auth-cors && dub build)
